<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        let storedTheme = null;
        try {
          storedTheme = window.localStorage.getItem('hackweek.theme');
        } catch {}
        const prefersDark =
          typeof window.matchMedia === 'function' &&
          window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme =
          storedTheme === 'light' || storedTheme === 'dark'
            ? storedTheme
            : prefersDark
              ? 'dark'
              : 'light';
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#130f1c" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Hackweek — a week for building ambitious ideas together."
    />
    <link
      rel="icon"
      href="/favicon.ico"
      sizes="16x16 32x32 48x48"
      type="image/vnd.microsoft.icon"
    />
    <title>Sentry - #hackweek</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
