name: Deploy staging

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type deploy-staging after the local readiness gate and operator review
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hackweek-staging
  cancel-in-progress: false

jobs:
  verify:
    if: inputs.confirm == 'deploy-staging'
    uses: ./.github/workflows/test.yml

  deploy:
    name: Deploy reviewed staging configuration
    needs: verify
    runs-on: ubuntu-latest
    environment: hackweek-staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate required staging configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          node -e "const c=require('./wrangler.staging.json').env.staging; for (const value of [c.d1_databases[0].database_id,c.r2_buckets[0].bucket_name,c.vars.ACCESS_AUD,c.vars.ACCESS_TEAM_DOMAIN,c.vars.STREAM_ACCOUNT_ID,c.vars.STREAM_ALLOWED_ORIGIN,c.vars.STREAM_DELIVERY_HOST,c.vars.R2_ACCOUNT_ID,c.vars.R2_BUCKET_NAME]) if (!value || /replace.me/i.test(value) || value === '00000000-0000-0000-0000-000000000000') process.exit(1)"
      - name: Build Worker and static assets
        run: npm run build
      - name: Apply reviewed D1 migrations
        run: npx wrangler d1 migrations apply hackweek-db --remote --env staging --config wrangler.staging.json --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker and static assets
        run: npx wrangler deploy --env staging --config wrangler.staging.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
